<!doctype html><html><head><meta charset="utf-8"><title>HStora Z2U Assistant</title><style>body{margin:0;background:#0b0e13;color:#f2f4f7;font:14px system-ui;width:390px}main{padding:24px}h1{font-size:20px;margin:0 0 6px}p{color:#929aa8;line-height:1.5}label{display:grid;gap:6px;margin:14px 0;font-weight:650}input{padding:10px;border:1px solid #303744;border-radius:8px;background:#10151d;color:#fff}button{padding:10px;border:0;border-radius:8px;background:#65f2ad;color:#07110c;font-weight:750;cursor:pointer;width:100%}#status{color:#65f2ad;min-height:20px}</style></head><body><main><h1>HStora → Z2U</h1><p>Connect this browser to your watcher backend. Credentials are stored only in this Chrome profile.</p><label>Backend URL<input id="backend" placeholder="https://hstora.itspanel.com"></label><label>Nginx username<input id="username" autocomplete="username"></label><label>Nginx password<input id="password" type="password" autocomplete="current-password"></label><label>Extension secret<input id="secret" type="password" autocomplete="off"></label><button id="save">Save settings</button><p id="status"></p></main><script src="options.js"></script></body></html>
